name: build
on:
  push:
    branches:
      - main
  # refresh the NOTAM snapshot (docs/assets/data/notams.json) every hour on
  # the hour (UTC). GitHub often starts top-of-the-hour runs a few minutes late.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# never run two deploys at once (a push landing during a scheduled refresh)
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      # The last snapshot a run produced (refreshed data isn't committed), so
      # only NOTAMs issued since then need their CAAP detail page fetched.
      - uses: actions/cache/restore@v4
        with:
          path: .notam-cache
          key: notams-${{ github.run_id }}
          restore-keys: notams-
      # Fetch fresh NOTAMs from the CAAP AIS. If CAAP is down or blocks the
      # runner, keep going and deploy the committed snapshot instead — the
      # NOTAMs page warns readers when its data is over a day old.
      - name: Refresh NOTAMs
        id: notams
        run: |
          python tools/build_notams.py --cache .notam-cache/notams.json
          mkdir -p .notam-cache && cp docs/assets/data/notams.json .notam-cache/
        continue-on-error: true
        timeout-minutes: 15
      - uses: actions/cache/save@v4
        if: steps.notams.outcome == 'success'
        with:
          path: .notam-cache
          key: notams-${{ github.run_id }}
      # --no-history: hourly deploys would otherwise pile a full site commit
      # onto gh-pages every hour
      - run: mkdocs gh-deploy --force --no-history
